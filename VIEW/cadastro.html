<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="shortcut icon" href="../Imagens/Favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <script src="../JavaScript/script.js"></script>
</head>
<body>

    <main class="main-container">

        <!-- Logo -->
        <div class="site-logo">
            <img src="../Imagens/logo.png" alt="Al3xandria">
            <div class="logo-sub">Biblioteca de Jogos</div>
        </div>

        <!-- Card de cadastro -->
        <div class="form-container">
            <h2>Criar Conta</h2>

            <form id="form-cadastro">

                <label for="cadastro-nome">Nome</label>
                <input type="text" id="cadastro-nome" placeholder="Seu nome completo" required>

                <label for="cadastro-email">E-mail</label>
                <input type="email" id="cadastro-email" placeholder="seu@email.com" required>

                <label for="cadastro-senha">Senha</label>
                <input type="password" id="cadastro-senha" placeholder="Mínimo 8 caracteres" required>

                <label for="cadastro-celular">Celular</label>
                <input type="tel" id="cadastro-celular" placeholder="11988888888">


                <button type="button" class="btn-primary" onclick="postData()">
                    Criar Conta
                </button>
                
                <div class="divisor">ou</div>

                <button type="button" class="btn-secondary" onclick="window.location.href='visualizar.html'">
                    Ver Dados Cadastrados
                </button>

            </form>
        </div>

    </main>

</body>
</html>
